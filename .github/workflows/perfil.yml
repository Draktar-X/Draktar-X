name: Perfil

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días, 01:17 hora de Ecuador
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: [".github/workflows/perfil.yml", ".github/scripts/**"]

permissions:
  contents: write

jobs:
  tarjetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar tarjetas de commits y actividad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TZ_OFFSET: "-5"
        run: |
          python3 .github/scripts/commits_hora.py assets/commits-hora.svg
          python3 .github/scripts/actividad.py assets/actividad.svg

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commits-hora.svg assets/actividad.svg
          git diff --cached --quiet || (git commit -m "Actualizar commits y actividad" && git push)
