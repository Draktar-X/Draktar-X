name: Perfil

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días, 01:17 hora de Ecuador
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: [".github/workflows/perfil.yml", ".github/scripts/**"]

permissions:
  contents: write

jobs:
  serpiente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#161b22,#2d333b,#484f58,#768390,#adbac7
            dist/snake-light.svg?palette=github-light&color_snake=#24292f&color_dots=#ebedf0,#d0d7de,#afb8c1,#8c959f,#57606a

      - name: Generar commits por hora
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TZ_OFFSET: "-5"
        run: python3 .github/scripts/commits_hora.py assets/commits-hora.svg

      - name: Guardar cambios
        run: |
          mkdir -p assets/snake
          cp dist/*.svg assets/snake/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake assets/commits-hora.svg
          git diff --cached --quiet || (git commit -m "Actualizar serpiente y commits por hora" && git push)
